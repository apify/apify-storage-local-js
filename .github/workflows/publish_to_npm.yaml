name: Publish to NPM

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Git ref to publish (branch, tag, or commit SHA)
                required: true
                type: string
            tag:
                description: NPM dist-tag
                required: true
                type: choice
                default: latest
                options:
                    - latest
                    - beta

permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    publish_to_npm:
        name: Publish to NPM
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  ref: ${{ inputs.ref }}
            - name: Use Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
            - name: Install pnpm and dependencies
              uses: apify/actions/pnpm-install@v1.1.2
            - name: Check version consistency and bump pre-release version (beta only)
              if: ${{ inputs.tag == 'beta' }}
              run: node ./.github/scripts/before-beta-release.js
            - name: Build module
              run: pnpm build
            - name: Publish to NPM
              run: pnpm publish --tag ${{ inputs.tag }} --no-git-checks
